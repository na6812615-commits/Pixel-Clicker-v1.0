name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Pixie Clicker APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Prepare debug keystore and env
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Restored debug.keystore from debug.keystore.base64"
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "Generated fallback debug.keystore"
            fi
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ] && [ -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Prepare downloadable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Pixie-Clicker.apk
          ls -lh dist/Pixie-Clicker.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixie-Clicker-APK
          path: dist/Pixie-Clicker.apk
          retention-days: 30

      - name: Write build summary
        run: |
          echo "### Pixie Clicker APK Ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Scroll down to **Artifacts** and click **Pixie-Clicker-APK** to download \`Pixie-Clicker.apk\` for Android." >> "$GITHUB_STEP_SUMMARY"
